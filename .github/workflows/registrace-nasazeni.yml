name: Registrace – nasazení (ručně)
# Spouští se jen ručně: GitHub → Actions → „Registrace – nasazení (ručně)“ → Run workflow.
# Nejdřív nasaďte na „test“, vyzkoušejte a teprve potom „produkce“ (vyžaduje napsat NASADIT).
on:
  workflow_dispatch:
    inputs:
      cil:
        description: 'Kam nasadit'
        type: choice
        options: [test, produkce]
        default: test
      potvrzeni:
        description: 'Pro produkci napište NASADIT'
        required: false
      prvni:
        description: 'První nasazení (na serveru ještě nic není – přeskočí zálohu)'
        type: boolean
        default: false
concurrency: registrace-nasazeni
jobs:
  testy:
    uses: ./.github/workflows/registrace-testy.yml

  nasazeni:
    needs: testy
    runs-on: ubuntu-latest
    env:
      SLOZKA: ${{ inputs.cil == 'produkce' && 'registrace' || 'registrace-test' }}
      URL: ${{ inputs.cil == 'produkce' && 'https://eshop.bkludgerovice.cz/registrace' || 'https://eshop.bkludgerovice.cz/registrace-test' }}
      CRON_KEY: ${{ inputs.cil == 'produkce' && secrets.REG_CRON_KEY || secrets.REG_TEST_CRON_KEY }}
    steps:
      - name: Kontrola potvrzení
        if: inputs.cil == 'produkce' && inputs.potvrzeni != 'NASADIT'
        run: echo "Pro nasazení do produkce napište do pole potvrzení NASADIT." && exit 1
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Knihovny bez vývojových nástrojů
        working-directory: registrace
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - name: Kontrola klíče pro plánované úlohy
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "::error::V GitHubu chybí secret ${{ inputs.cil == 'produkce' && 'REG_CRON_KEY' || 'REG_TEST_CRON_KEY' }} (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Pokud už aplikace na serveru běží, ověříme klíč hned (ne až po nahrání).
          code=$(curl -sS --max-time 60 -o odpoved.txt -w '%{http_code}' -H "X-Cron-Key: $CRON_KEY" "$URL/cron?task=status&key=$CRON_KEY" || true)
          cat odpoved.txt; echo
          if grep -q "challenges.cloudflare.com" odpoved.txt 2>/dev/null; then echo "::error::Požadavek zablokoval Cloudflare (kontrola robotů) – klíč je v pořádku. Subdoménu eshop.bkludgerovice.cz je potřeba v Cloudflare přepnout na „DNS only“ (viz docs/registrace/provoz.md, kap. A8)."; exit 1; fi
          if [ "$code" = "403" ]; then echo "::error::Server odmítl klíč: secret ${{ inputs.cil == 'produkce' && 'REG_CRON_KEY' || 'REG_TEST_CRON_KEY' }} v GitHubu nesouhlasí s cron_key v config.php na serveru."; exit 1; fi
      - name: Záloha databáze před nasazením
        if: ${{ !inputs.prvni }}
        run: |
          code=$(curl -sS --max-time 120 -o odpoved.txt -w '%{http_code}' -H "X-Cron-Key: $CRON_KEY" "$URL/cron?task=backup&key=$CRON_KEY" || true)
          cat odpoved.txt; echo
          if grep -q "challenges.cloudflare.com" odpoved.txt 2>/dev/null; then echo "::error::Požadavek zablokoval Cloudflare (kontrola robotů) – klíč je v pořádku. Subdoménu eshop.bkludgerovice.cz je potřeba v Cloudflare přepnout na „DNS only“ (viz docs/registrace/provoz.md, kap. A8)."; exit 1; fi
          if [ "$code" = "403" ]; then echo "::error::Server odmítl klíč: secret ${{ inputs.cil == 'produkce' && 'REG_CRON_KEY' || 'REG_TEST_CRON_KEY' }} v GitHubu nesouhlasí s cron_key v config.php na serveru."; exit 1; fi
          if [ "$code" != "200" ]; then echo "::error::Server vrátil chybu $code."; exit 1; fi
      - name: Nahrání na Wedos (jen složka registrací)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./registrace/
          server-dir: ./${{ env.SLOZKA }}/
          exclude: |
            **/.git*
            **/.git*/**
            tests/**
            phpunit.xml
            cli/devserver.php
            config/config.php
            storage/backups/**
            storage/mail/**
            storage/cache/**
            storage/logs/**
      - name: Databázové změny (migrace)
        run: |
          code=$(curl -sS --max-time 120 -o odpoved.txt -w '%{http_code}' -H "X-Cron-Key: $CRON_KEY" "$URL/cron?task=migrate&key=$CRON_KEY" || true)
          cat odpoved.txt; echo
          if grep -q "challenges.cloudflare.com" odpoved.txt 2>/dev/null; then echo "::error::Požadavek zablokoval Cloudflare (kontrola robotů) – klíč je v pořádku. Subdoménu eshop.bkludgerovice.cz je potřeba v Cloudflare přepnout na „DNS only“ (viz docs/registrace/provoz.md, kap. A8)."; exit 1; fi
          if [ "$code" = "403" ]; then echo "::error::Server odmítl klíč: secret ${{ inputs.cil == 'produkce' && 'REG_CRON_KEY' || 'REG_TEST_CRON_KEY' }} v GitHubu nesouhlasí s cron_key v config.php na serveru."; exit 1; fi
          if [ "$code" != "200" ]; then echo "::error::Server vrátil chybu $code."; exit 1; fi
      - name: Kontrola po nasazení
        run: |
          set -e
          curl -fsS --max-time 30 "$URL/health" && echo
          curl -fsS -o /dev/null --max-time 30 https://eshop.bkludgerovice.cz/ && echo "e-shop OK"
          curl -fsS -o /dev/null --max-time 30 https://eshop.bkludgerovice.cz/ples/ && echo "ples OK"
