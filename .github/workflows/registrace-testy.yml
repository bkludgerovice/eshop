name: Registrace – automatické testy
on:
  push:
    paths: ['registrace/**', '.github/workflows/registrace-*.yml']
  pull_request:
    paths: ['registrace/**']
  workflow_call:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']   # 8.5 = verze nastavená na Wedosu
    name: testy (PHP ${{ matrix.php }})
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bkl_test
          MARIADB_USER: bkl
          MARIADB_PASSWORD: bkl
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: registrace
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, sodium, zlib, gd, intl, pcntl, curl, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Kontrola syntaxe
        run: find app cli templates index.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Testy (jednotkové + proti MariaDB)
        run: vendor/bin/phpunit
        env:
          BKL_TEST_DB_HOST: 127.0.0.1
