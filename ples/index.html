<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ples BK Ludgeřovice 2027 – rezervace míst</title>
<style>
:root{
  --bg:#f5f3f2;--surface:#ffffff;--fg:#141414;--muted:#5d5857;--line:#e3dedc;
  --accent:#db131e;--accent-ink:#ffffff;--accent-soft:#fbe3e4;
  --taken:#d9d4d2;--taken-ink:#a19b99;--free:#ffffff;--floor:#ece8e6;--stage:#141414;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121111;--surface:#1d1b1b;--fg:#f3f1f0;--muted:#aaa3a1;--line:#332f2e;
  --accent:#e8242f;--accent-soft:#3a1517;--taken:#3a3634;--taken-ink:#6f6866;--free:#1d1b1b;--floor:#191717;--stage:#f3f1f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121111;--surface:#1d1b1b;--fg:#f3f1f0;--muted:#aaa3a1;--line:#332f2e;
  --accent:#e8242f;--accent-soft:#3a1517;--taken:#3a3634;--taken-ink:#6f6866;--free:#1d1b1b;--floor:#191717;--stage:#f3f1f0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 110px}
header.top{display:flex;gap:16px;align-items:center;padding:18px 0 10px;margin-bottom:12px}
header.top img{height:56px;width:auto}
header.top h1{margin:0;font-size:clamp(22px,5vw,32px);font-style:italic;font-weight:700;text-transform:uppercase;line-height:1.05}
header.top p{margin:4px 0 0;color:var(--muted)}
.demo{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.mapcard{padding:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin:2px 6px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--accent);background:var(--free);display:inline-block}
.dot.taken{background:var(--taken);border-color:var(--taken)}
.dot.sel{background:var(--accent)}
svg.map{width:100%;height:auto;display:block;touch-action:manipulation}
.seat{cursor:pointer}
.seat circle{fill:var(--free);stroke:var(--accent);stroke-width:1.3}
.seat text{fill:var(--accent);font:700 6px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.seat.sel circle{fill:var(--accent)} .seat.sel text{fill:var(--accent-ink)}
.seat.taken{cursor:not-allowed} .seat.taken circle{fill:var(--taken);stroke:var(--taken)} .seat.taken text{fill:var(--taken-ink)}
.seat:not(.taken):hover circle{stroke-width:2.4}
.tbar{fill:var(--line);cursor:pointer}
.tlabel{fill:var(--fg);font:700 7.5px var(--font);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:8px 6px 2px}
h2{font-size:21px;margin:0 0 4px;font-weight:900}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.picked{list-style:none;margin:0 0 14px;padding:0}
.picked li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.picked button{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 6px;font-size:14px;text-decoration:underline}
.empty{color:var(--muted);padding:14px;border:1.5px dashed var(--line);border-radius:10px;margin-bottom:14px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:var(--surface);font-size:20px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:32px;text-align:center;font-weight:700}
.dinner small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding-top:12px;margin-top:6px;border-top:2px solid var(--fg)}
form{margin-top:18px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;font-weight:700}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;font-size:16px}
textarea{min-height:64px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:17px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-weight:700}
.err{color:var(--accent);font-size:14px;min-height:1em;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:12px;z-index:20}
.bar b{font-size:17px}.bar .btn{width:auto;padding:12px 18px}
@media (max-width:860px){.bar.on{display:flex}}
.framed .bar.on{display:none}
.framed .wrap{padding-top:14px}
.framed .sheet{position:absolute;inset:auto 0 auto 0;background:none;align-items:flex-start}
.framed .sheet .in{border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);margin:0 8px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.on{display:flex}
.sheet .in{max-height:92vh;overflow:auto;background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.sheet{align-items:center}.sheet .in{max-height:92vh;overflow:auto;border-radius:18px}}
.tview{display:grid;gap:8px;justify-content:center;margin:18px 0}
.tview .r{display:flex;gap:8px;justify-content:center}
#whole{margin-bottom:12px}
.tview .tb{background:var(--line);border-radius:6px;text-align:center;font-weight:700;font-size:13px;padding:4px;color:var(--muted)}
.tview.vert{grid-template-columns:auto auto auto;align-items:stretch}
.tview.vert .col{display:grid;gap:8px}
.tview.vert .tb{writing-mode:vertical-rl;padding:6px 4px}
.sb{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);background:var(--free);color:var(--accent);font-weight:900;font-size:16px;cursor:pointer}
.sb.sel{background:var(--accent);color:var(--accent-ink)}
.sb.taken{background:var(--taken);border-color:var(--taken);color:var(--taken-ink);cursor:not-allowed}
/* done */
.done h2{font-size:26px}
.pay{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;margin:16px 0}
@media (max-width:420px){.pay{grid-template-columns:1fr}}
.qr{background:#fff;padding:10px;border-radius:12px;width:200px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
dt{color:var(--muted)} dd{margin:0;font-weight:700;word-break:break-word}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.seat circle{transition:fill .12s}}
.sitenav{display:flex;gap:8px;padding-top:14px;overflow-x:auto;scrollbar-width:none}
.sitenav a{padding:8px 15px;border-radius:999px;text-decoration:none;color:var(--fg);font-weight:700;font-size:15px;border:1.5px solid var(--line);white-space:nowrap;background:var(--surface)}
.sitenav a:hover{border-color:var(--accent)}
.sitenav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.framed .sitenav{display:none}
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitenav" aria-label="Sekce webu"><a href="/">Klubové oblečení</a><a href="/ples/" aria-current="page">Ples 2027</a></nav>
  <header class="top">
    <img src="logo.png" alt="BK Ludgeřovice">
    <div>
      <h1>Ples BK Ludgeřovice 2027</h1>
      <p id="evinfo"></p>
    </div>
  </header>
  <p class="demo" id="demo" hidden>Ukázkový režim: obsazenost je vymyšlená a rezervace se nikam neodesílá.</p>

  <div class="grid">
    <section class="card mapcard" aria-label="Plánek sálu">
      <div class="legend">
        <span><i class="dot"></i>Volné</span>
        <span><i class="dot sel"></i>Vybrané</span>
        <span><i class="dot taken"></i>Obsazené</span>
      </div>
      <svg class="map" id="map" viewBox="20 20 510 680" role="group" aria-label="Stoly a místa v sále"></svg>
      <p class="hint">Klepněte na stůl a vyberte místa, nebo celý stůl. Na počítači můžete klikat přímo na židle.</p>
    </section>

    <aside class="card" id="panel"></aside>
  </div>
</div>

<div class="bar" id="bar"><span id="barTxt"></span><button class="btn" id="barGo" type="button">Pokračovat</button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="in">
    <h2 id="shTitle"></h2>
    <p class="sub" id="shSub"></p>
    <div id="shBody"></div>
    <button class="btn" id="shOk" type="button">Hotovo</button>
  </div>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';

          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

(function (factory) {
  if (typeof define === 'function' && define.amd) {
      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();
  }
}(function () {
    return qrcode;
}));

</script>
<script>
/* ===== Nastavení ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx2rz2vdd3rARxcoGJbIHxiUaOIZpEirWnAt2GdAMeVamByGXtjs46ccCDcNb0kd7X1/exec',   // ← sem vložte adresu webové aplikace Apps Scriptu (končí /exec). Prázdné = ukázkový režim.
};
// Výchozí hodnoty pro ukázkový režim; v ostrém provozu se načtou z listu Nastavení.
let SET = {
  name:'Ples BK Ludgeřovice 2027', event:'Sobota 30. 1. 2027 od 19:30, Obecní dům Ludgeřovice',
  ticket:280, dinner:220, dinnerName:'Řízek, šťouchané brambory, obloha', max:12, dueDays:7,
  account:'2502518589/2010', iban:'CZ5520100000002502518589', contact:'david.bibrlik@bkludgerovice.cz',
  sale:'open', start:null
};
const FRAMED = window.parent!==window; if(FRAMED) document.documentElement.classList.add('framed');
const TEST = new URLSearchParams(location.search).get('test') || '';

/* ===== Rozložení sálu (podle plánku) ===== */
const H12 = [[1,2,3,4,5,6],[12,11,10,9,8,7]];
const H6  = [[1,2,3],[6,5,4]];
const V12 = [[12,11,10,9,8,7],[1,2,3,4,5,6]];
const TABLES = [];
for (let n=1;n<=9;n++) TABLES.push({n, kind:'h', rows:H12, cx:115, cy:162+(9-n)*55.75});
TABLES.push({n:10, kind:'v', cols:V12, cx:240, top:40});
TABLES.push({n:11, kind:'v', cols:V12, cx:347, top:40});
for (let n=12;n<=18;n++) TABLES.push({n, kind:'h', rows:H6, cx:457, cy:168+(n-12)*54});
TABLES.push({n:19, kind:'h', rows:H12, cx:448, cy:603});
const STEP = 13.6;
const key = (t,s)=>t+'-'+s;
const seatsOf = t => (t.rows||t.cols).flat();

/* ===== Stav ===== */
let taken = new Set(), selected = [], dinners = 0, done = null, flash = '';
let form = {name:'',email:'',phone:'',note:'',gdpr:false};
const DEMO = !CONFIG.API_URL;

const $ = s=>document.querySelector(s);
const kc = n=>Number(n).toLocaleString('cs-CZ')+'\u00a0Kč';
const seatsWord = n=> n===1?'místo':(n>=2&&n<=4?'místa':'míst');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isOpen = ()=> SET.sale==='open';

/* ===== Plánek ===== */
function drawMap(){
  let h='';
  h+=`<rect x="180" y="153" width="186" height="452" rx="4" fill="var(--floor)" stroke="var(--line)"/>`;
  h+=`<text x="273" y="379" class="tlabel" style="font-size:12px;fill:var(--muted)">Taneční parket</text>`;
  h+=`<rect x="180" y="622" width="182" height="62" rx="4" fill="var(--stage)"/>`;
  h+=`<text x="271" y="653" class="tlabel" style="font-size:13px;fill:var(--bg)">Jeviště</text>`;
  for(const t of TABLES){
    h+=`<g class="table" data-t="${t.n}">`;
    if(t.kind==='h'){
      const w=t.rows[0].length*STEP+6;
      h+=`<rect class="tbar" x="${t.cx-w/2}" y="${t.cy-6}" width="${w}" height="12" rx="3"/>`;
      h+=`<text class="tlabel" x="${t.cx}" y="${t.cy}">stůl ${t.n}</text>`;
      t.rows.forEach((row,ri)=>row.forEach((s,i)=>{ h+=seatSvg(t.n,s,t.cx+(i-(row.length-1)/2)*STEP,t.cy+(ri?14:-14)); }));
    } else {
      const len=t.cols[0].length*STEP, my=t.top-6+len/2;
      h+=`<rect class="tbar" x="${t.cx-6}" y="${t.top-6}" width="12" height="${len}" rx="3"/>`;
      h+=`<text class="tlabel" x="${t.cx}" y="${my}" transform="rotate(-90 ${t.cx} ${my})">stůl ${t.n}</text>`;
      t.cols.forEach((col,ci)=>col.forEach((s,i)=>{ h+=seatSvg(t.n,s,t.cx+(ci?14:-14),t.top+i*STEP); }));
    }
    h+='</g>';
  }
  $('#map').innerHTML=h;
}
function seatSvg(t,s,x,y){
  return `<g class="seat" data-k="${key(t,s)}" tabindex="0" role="button" aria-label="Stůl ${t}, místo ${s}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.8"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${s}</text></g>`;
}
function paintMap(){
  document.querySelectorAll('#map .seat').forEach(g=>{
    const k=g.dataset.k, isT=taken.has(k), isS=selected.includes(k);
    g.classList.toggle('taken',isT); g.classList.toggle('sel',isS);
    g.setAttribute('aria-pressed',isS); g.setAttribute('aria-disabled',isT||!isOpen());
  });
}
const coarse = matchMedia('(pointer:coarse), (max-width:600px)');
$('#map').addEventListener('click',e=>{
  if(done) return;
  const seat=e.target.closest('.seat'), table=e.target.closest('.table');
  if(!table) return;
  if(seat && !coarse.matches) toggle(seat.dataset.k); else openTable(+table.dataset.t, e.pageY);
});
$('#map').addEventListener('keydown',e=>{
  const seat=e.target.closest('.seat');
  if(seat && (e.key==='Enter'||e.key===' ')){e.preventDefault(); toggle(seat.dataset.k);}
});

function toggle(k){
  if(!isOpen()){ flash=closedText(); update(); return; }
  if(taken.has(k)) return;
  const i=selected.indexOf(k);
  if(i>=0) selected.splice(i,1);
  else if(selected.length>=SET.max) flash=`Najednou lze rezervovat nejvýše ${SET.max} míst.`;
  else selected.push(k);
  dinners=Math.min(dinners,selected.length);
  update();
}
function toggleTable(n){
  if(!isOpen()){ flash=closedText(); update(); return; }
  const t=TABLES.find(x=>x.n===n);
  const free=seatsOf(t).map(s=>key(n,s)).filter(k=>!taken.has(k));
  const allIn=free.length && free.every(k=>selected.includes(k));
  if(allIn) selected=selected.filter(k=>!free.includes(k));
  else{
    const add=free.filter(k=>!selected.includes(k));
    if(selected.length+add.length>SET.max) flash=`Najednou lze rezervovat nejvýše ${SET.max} míst. Uvolněte nejdřív místa u jiného stolu.`;
    else selected.push(...add);
  }
  update();
}

/* ===== Detail stolu ===== */
let openT=null;
function openTable(n,y){ openT=n; if(FRAMED) $('#sheet').style.top=Math.max(0,(y||0)-160)+'px'; renderTable(); $('#sheet').classList.add('on'); $('#shOk').focus(); }
function renderTable(){
  const t=TABLES.find(x=>x.n===openT); if(!t) return;
  const all=seatsOf(t), free=all.filter(s=>!taken.has(key(t.n,s)));
  $('#shTitle').textContent='Stůl '+t.n;
  $('#shSub').textContent = free.length ? `Volná místa: ${free.length} z ${all.length}. Klepnutím místo vyberete nebo zrušíte.` : 'Tento stůl je plně obsazený.';
  const b=s=>{const k=key(t.n,s);const c=taken.has(k)?'taken':selected.includes(k)?'sel':'';
    return `<button type="button" class="sb ${c}" data-k="${k}" aria-pressed="${c==='sel'}" ${c==='taken'?'disabled':''} aria-label="Místo ${s}">${s}</button>`};
  let h = t.kind==='h'
    ? `<div class="tview"><div class="r">${t.rows[0].map(b).join('')}</div><div class="tb">stůl ${t.n}</div><div class="r">${t.rows[1].map(b).join('')}</div></div>`
    : `<div class="tview vert"><div class="col">${t.cols[0].map(b).join('')}</div><div class="tb">stůl ${t.n}</div><div class="col">${t.cols[1].map(b).join('')}</div></div>`;
  const freeKeys=free.map(s=>key(t.n,s)), allIn=freeKeys.length && freeKeys.every(k=>selected.includes(k));
  if(free.length>1 && isOpen()) h+=`<button type="button" class="btn ghost" id="whole">${allIn?'Zrušit výběr u tohoto stolu':(free.length===all.length?'Vybrat celý stůl':'Vybrat všechna volná místa ('+free.length+')')}</button>`;
  $('#shBody').innerHTML=h+`<p class="err" role="alert">${esc(flash)}</p>`;
  const w=$('#whole'); if(w) w.onclick=()=>toggleTable(t.n);
}
$('#shBody').addEventListener('click',e=>{const b=e.target.closest('.sb'); if(b) toggle(b.dataset.k);});
function closeSheet(){ $('#sheet').classList.remove('on'); openT=null; }
$('#shOk').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* ===== Panel ===== */
function grouped(list){
  const m=new Map();
  list.forEach(k=>{const [t,s]=k.split('-').map(Number); if(!m.has(t)) m.set(t,[]); m.get(t).push(s);});
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([t,s])=>[t,s.sort((a,b)=>a-b)]);
}
const total = ()=> selected.length*SET.ticket + dinners*SET.dinner;
function closedText(){
  if(SET.sale==='before'){
    const d=SET.start?new Date(SET.start):null;
    return d ? `Prodej začne ${d.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'})} v ${d.toLocaleTimeString('cs-CZ',{hour:'numeric',minute:'2-digit'})}.` : 'Prodej ještě nezačal.';
  }
  return 'Prodej vstupenek skončil.';
}

function renderPanel(){
  if(done){ renderDone(); return; }
  const p=$('#panel'), n=selected.length, freeCount=TABLES.reduce((a,t)=>a+seatsOf(t).filter(s=>!taken.has(key(t.n,s))).length,0);
  if(!isOpen()){
    p.innerHTML=`<h2>${esc(closedText())}</h2><p class="sub">V plánku si zatím můžete prohlédnout rozložení stolů. Vstupenka stojí ${kc(SET.ticket)}, večeře ${kc(SET.dinner)}.</p>`;
    return;
  }
  if(!freeCount && !n){
    p.innerHTML=`<h2>Vyprodáno</h2><p class="sub">Všechna místa jsou rezervovaná. Děkujeme za zájem! Pokud se nějaké místo uvolní, objeví se v plánku znovu.</p>`;
    return;
  }
  let h=`<h2>Vaše rezervace</h2><p class="sub">Vstupenka ${kc(SET.ticket)}. Najednou lze rezervovat až ${SET.max} míst, tedy i celý stůl.</p>`;
  if(!n) h+=`<div class="empty">Zatím nemáte vybrané žádné místo. Vyberte je v plánku sálu.</div>`;
  else h+='<ul class="picked">'+grouped(selected).map(([t,ss])=>ss.map(s=>`<li><span>Stůl ${t}, místo ${s}</span><button type="button" data-rm="${key(t,s)}" aria-label="Zrušit stůl ${t}, místo ${s}">Zrušit</button></li>`).join('')).join('')+'</ul>';
  h+=`<div class="row"><span>Vstupenky: ${n} × ${kc(SET.ticket)}</span><b>${kc(n*SET.ticket)}</b></div>
  <div class="row dinner"><span>Večeře, ${kc(SET.dinner)} za porci<small>${esc(SET.dinnerName)}</small></span>
    <div class="stepper" aria-label="Počet večeří"><button type="button" id="dMinus" aria-label="Méně večeří" ${dinners<=0?'disabled':''}>−</button><output id="dOut" aria-live="polite">${dinners}</output><button type="button" id="dPlus" aria-label="Více večeří" ${dinners>=n?'disabled':''}>+</button></div></div>
  <div class="total"><span>Celkem</span><span>${kc(total())}</span></div>
  <form id="f" novalidate>
    <label>Jméno a příjmení<input type="text" name="name" autocomplete="name" required value="${esc(form.name)}"></label>
    <label>E-mail (sem pošleme vstupenku)<input type="email" name="email" autocomplete="email" required value="${esc(form.email)}"></label>
    <label>Telefon<input type="tel" name="phone" autocomplete="tel" required value="${esc(form.phone)}"></label>
    <label>Poznámka<textarea name="note">${esc(form.note)}</textarea></label>
    <input type="text" name="web" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
    <label class="check"><input type="checkbox" name="gdpr" ${form.gdpr?'checked':''}><span>Souhlasím se zpracováním osobních údajů pro účely rezervace plesu.</span></label>
    <p class="note">Platbu je potřeba poslat do ${SET.dueDays} dnů, jinak se rezervace zruší. Rezervaci nelze online stornovat; v případě potřeby pište na ${esc(SET.contact)}.</p>
    <p class="err" id="fErr" role="alert">${esc(flash)}</p>
    <button class="btn" id="send" ${n?'':'disabled'}>Rezervovat ${n?n+' '+seatsWord(n)+' za '+kc(total()):''}</button>
  </form>`;
  p.innerHTML=h;
  p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>toggle(b.dataset.rm));
  $('#dMinus').onclick=()=>{dinners=Math.max(0,dinners-1);update();};
  $('#dPlus').onclick=()=>{dinners=Math.min(n,dinners+1);update();};
  const f=$('#f');
  f.oninput=()=>{form={name:f.name.value,email:f.email.value,phone:f.phone.value,note:f.note.value,gdpr:f.gdpr.checked};};
  f.onsubmit=e=>{e.preventDefault();submit(f.web.value);};
}
function update(){
  paintMap(); renderPanel(); if(openT) renderTable();
  const n=selected.length;
  $('#bar').classList.toggle('on',n>0 && !done);
  $('#barTxt').innerHTML=`<b>${n} ${seatsWord(n)}</b>, ${kc(total())}`;
  flash='';
}
$('#barGo').onclick=()=>{ closeSheet(); $('#panel').scrollIntoView({behavior:'smooth'}); };

/* ===== Komunikace se serverem ===== */
async function api(params, body){
  const qs=new URLSearchParams(Object.assign({},params,TEST?{test:TEST}:{})).toString();
  const r = body ? await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({},body,TEST?{test:TEST}:{}))})
                 : await fetch(CONFIG.API_URL+'?'+qs);
  return r.json();
}
async function refresh(){
  if(DEMO || done) return;
  try{
    const j=await api({action:'seats'});
    if(!j.ok) return;
    taken=new Set(j.taken||[]);
    Object.keys(SET).forEach(k=>{ if(j[k]!==undefined && j[k]!==null) SET[k]=j[k]; });
    SET.start=j.start;
    const lost=selected.filter(k=>taken.has(k));
    if(lost.length){ selected=selected.filter(k=>!taken.has(k)); dinners=Math.min(dinners,selected.length);
      flash=`Někdo byl rychlejší, místa ${lost.map(k=>k.replace('-',', místo ')).map(x=>'stůl '+x).join('; ')} už nejsou volná.`; }
    $('#evinfo').textContent=SET.event;
    update();
  }catch(e){}
}

async function submit(honeypot){
  const err=m=>{$('#fErr').textContent=m;};
  if(!form.name.trim()) return err('Vyplňte jméno a příjmení.');
  if(!/^\S+@\S+\.\S+$/.test(form.email.trim())) return err('Zadejte platný e-mail, pošleme na něj vstupenku.');
  if(form.phone.replace(/\D/g,'').length<9) return err('Zadejte telefon, ať se vám můžeme ozvat.');
  if(!form.gdpr) return err('Pro odeslání potvrďte souhlas se zpracováním údajů.');
  const btn=$('#send'); btn.disabled=true; btn.textContent='Odesílám…';
  const payload={action:'reserve',seats:selected.slice(),dinners,...form,web:honeypot||''};
  try{
    let res;
    if(DEMO){ await new Promise(r=>setTimeout(r,600));
      const due=new Date(Date.now()+SET.dueDays*864e5);
      res={ok:true,vs:'2701014',amount:total(),due:due.toLocaleDateString('cs-CZ')}; }
    else res=await api(null,payload);
    if(!res.ok){
      if(res.taken){ res.taken.forEach(k=>taken.add(k)); selected=selected.filter(k=>!taken.has(k)); dinners=Math.min(dinners,selected.length); }
      flash=res.message||'Rezervaci se nepodařilo dokončit. Zkuste to prosím znovu.'; update(); return;
    }
    selected.forEach(k=>taken.add(k));
    done={...res,seats:grouped(selected),dinners,email:form.email};
    selected=[];dinners=0; update(); $('#panel').scrollIntoView({behavior:'smooth'});
  }catch(e){ flash='Spojení se nepodařilo. Zkontrolujte připojení a zkuste to znovu.'; update(); }
}

function ascii(s){return s.normalize('NFD').replace(/[\u0300-\u036f*]/g,'');}
function renderDone(){
  const d=done;
  const q=qrcode(0,'M');
  q.addData(`SPD*1.0*ACC:${SET.iban}*AM:${Number(d.amount).toFixed(2)}*CC:CZK*X-VS:${d.vs}*MSG:${ascii('Ples BKL '+d.vs)}`); q.make();
  const seatsTxt=d.seats.map(([t,ss])=>`stůl ${t}, ${ss.length===1?'místo':'místa'} ${ss.join(', ')}`).join('; ');
  $('#panel').innerHTML=`<div class="done">
    <h2>Rezervace ${esc(d.vs)} je přijata</h2>
    <p class="sub">Místa máte zablokovaná. Zaplaťte prosím do ${esc(d.due)}, jinak se rezervace zruší.</p>
    <div class="pay">
      <div class="qr" aria-label="QR kód pro platbu">${q.createSvgTag({cellSize:4,margin:2,scalable:true})}</div>
      <dl>
        <dt>Částka</dt><dd>${kc(d.amount)}</dd>
        <dt>Účet</dt><dd>${esc(SET.account)}</dd>
        <dt>Var. symbol</dt><dd>${esc(d.vs)}</dd>
        <dt>Místa</dt><dd>${esc(seatsTxt)}</dd>
        <dt>Večeře</dt><dd>${d.dinners}×</dd>
      </dl>
    </div>
    <p class="note">Platební údaje jsme poslali i na ${esc(d.email)}. Jakmile platba dorazí na účet, přijde vám vstupenka s QR kódem pro vstup.</p>
    <button class="btn ghost" type="button" id="again">Rezervovat další místa</button></div>`;
  $('#again').onclick=()=>{done=null;refresh();update();};
}

/* ===== Start ===== */
async function load(){
  $('#evinfo').textContent=SET.event;
  drawMap();
  if(DEMO){
    $('#demo').hidden=false;
    let x=7; const rnd=()=>{x=(x*16807)%2147483647;return x/2147483647;};
    TABLES.forEach(t=>{ const fill=rnd(); seatsOf(t).forEach(s=>{ if(rnd()<fill*0.8) taken.add(key(t.n,s)); }); });
    update();
  } else {
    update(); await refresh();
    setInterval(refresh, 30000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
  }
}
load();

/* výška pro vložení přes iframe */
if(window.parent!==window){
  const post=()=>parent.postMessage({bklPlesHeight:document.documentElement.scrollHeight},'*');
  new ResizeObserver(post).observe(document.body);
}
</script>
</body>
